# Каждый день добавляет в приложение 1 новые обои и 1–2 открытки.
# Нужен секрет FIREBASE_SERVICE_ACCOUNT — см. content_bot/README.md
name: Daily content

on:
  schedule:
    - cron: "0 3 * * *"   # 09:00 по Бишкеку
  workflow_dispatch:
    inputs:
      command:
        description: "daily, daily-cards, seed-cards или wallpapers"
        default: "daily"
      count:
        description: "Сколько штук для seed-cards и wallpapers"
        default: "30"

jobs:
  content:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: content_bot/requirements.txt
      - run: pip install -r content_bot/requirements.txt
      - name: Run bot
        working-directory: content_bot
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_BUCKET: hd-wallpaper-b78a8.appspot.com
          # Ручной запуск берёт команду из формы, расписание — из переменной DAILY_COMMAND
          # (например, daily-cards, пока не вышло обновление приложения), иначе daily
          COMMAND: ${{ github.event.inputs.command || vars.DAILY_COMMAND || 'daily' }}
          COUNT: ${{ github.event.inputs.count || '30' }}
        run: python bot.py "$COMMAND" --count "$COUNT"
